# Full stack. The reference landscape actually instantiated.
# Purpose in the set: the only plant where all three blind spots are live, so
# it is the only one where an ABSENT claim is defensible on all three cards.
id: STACK-AMO-PLANT-A
domain: AMO
card_type: stack_instance
instance_of: MODEL-AMO-PLANT-IT
name: Plant A — full discrete stack
customer: SYNTHETIC-PLANT-A          # invented; no customer data in this repo
manufacturing_mode: discrete

profile: >
  Aerospace sub-assembly, high mix, low volume, long lead times. The stack a
  tier-1 with a mature IT function actually runs. Included so that the other two
  plants read as deviations from something, rather than as arbitrary subsets.

systems_present:
  - {system_class: ERP,             deployment: SAP-PRD-100}
  - {system_class: MES,             deployment: OPCENTER-TLA-01}
  - {system_class: APS,             deployment: APS-TLA-01}
  - {system_class: PLM_ECM,         deployment: TEAMCENTER-PRD}
  - {system_class: QMS,             deployment: QMS-TLA}
  - {system_class: SCADA_HISTORIAN, deployment: HIST-TLA}
  - {system_class: SUPPLIER_PORTAL, deployment: PORTAL-TLA}
  - {system_class: IBP_SOP,         deployment: IBP-GRP}
  - {system_class: HUMAN_ROUTINE,   deployment: null}

systems_absent: []

interfaces_present:                  # subset of MODEL-AMO-PLANT-IT.interfaces
  - {from: IBP_SOP,         to: ERP}
  - {from: PLM_ECM,         to: ERP}
  - {from: PLM_ECM,         to: MES}
  - {from: ERP,             to: APS}
  - {from: APS,             to: MES}
  - {from: ERP,             to: MES}
  - {from: MES,             to: ERP}
  - {from: MES,             to: APS}
  - {from: MES,             to: QMS}
  - {from: SCADA_HISTORIAN, to: MES}
  - {from: SUPPLIER_PORTAL, to: ERP}
  - {from: ERP,             to: IBP_SOP}

bespoke_comparisons: []              # nothing custom closes a blind spot here

expected:                            # what derive.py must compute. A test oracle.
  live_blind_spots: [MES-ERP, APS-HUMAN_ROUTINE, PLM_ECM-ERP]
  cards:
    SIT-AMO-001: {verdict: JUDGMENT_IN_BENCH, detectability: DERIVED}
    SIT-AMO-002: {verdict: JUDGMENT_IN_BENCH, detectability: DERIVED}
    SIT-AMO-003: {verdict: JUDGMENT_IN_BENCH, detectability: ABSENT}
    SIT-AMO-004: {verdict: JUDGMENT_IN_BENCH, detectability: ABSENT}
    SIT-AMO-005: {verdict: JUDGMENT_IN_BENCH, detectability: ABSENT}
