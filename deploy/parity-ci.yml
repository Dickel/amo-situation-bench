# CI: include_cypher parity guard against the deployed MCP server.
#
# To enable: copy this to .github/workflows/parity.yml.
# (Pushing a workflow file needs a token with the `workflow` scope —
#  `gh auth refresh -s workflow` — or paste it via the GitHub web UI.)

name: mcp parity

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"   # daily, catches a bad deploy even with no commits
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mcp>=2,<3"
      - run: python -m mcp_server.tests.parity_deployed
        # override the target with a secret if you run a staging server:
        #   python -m mcp_server.tests.parity_deployed --url "${{ secrets.MCP_PARITY_URL }}"
